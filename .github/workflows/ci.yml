# simple pipeline: build and push docker image, and publish a CLI
# release asset tagged with the FG_VERSION in cli/fg.

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/filegilla:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/filegilla:${{ github.sha }}

      - name: Build summary
        if: success()
        run: echo "Docker image built and tagged successfully"

      - name: Read FG_VERSION from cli/fgcli
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: read_version
        run: |
          if [ ! -f cli/fgcli ]; then
            echo "::error::cli/fgcli not found in repo"
            exit 1
          fi
          version=$(sed -n 's/^FG_VERSION="\(.*\)"/\1/p' cli/fgcli | head -n1)
          if [ -z "${version}" ]; then
            echo "::error::could not parse FG_VERSION from cli/fgcli"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "FG_VERSION=${version}"

      - name: Publish fgcli release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.read_version.outputs.version }}
          name: "fgcli ${{ steps.read_version.outputs.version }}"
          generate_release_notes: true
          files: |
            cli/fgcli
